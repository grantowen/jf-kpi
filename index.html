* { box-sizing: border-box; }
body {

  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--topbar); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--grid);
}
.topbar-inner {

}
.brandline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
h1 { font: 600 22px/1 Georgia, "Iowan Old Style", "Times New Roman", serif;
     margin: 0; letter-spacing: 0; color: var(--brand); }
h1 .sub { color: var(--muted); font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.01em; }
.gen { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.ranges { display: inline-flex; gap: 5px; margin-left: 10px; }
.ranges button {
  font: 600 11.5px/1 system-ui, sans-serif; color: var(--ink-2);
  background: none; border: 1px solid var(--ring); border-radius: 999px;
  padding: 5px 11px; cursor: pointer;
}
.ranges button[aria-pressed="true"] { color: var(--brand); border-color: var(--brand); background: var(--accent-soft); }
.ranges button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
nav.tabs button {
  font: 600 13px/1 system-ui, sans-serif; color: var(--ink-2); background: none;
  border: none; border-bottom: 2px solid transparent; padding: 9px 13px 11px;
  cursor: pointer; white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px; }
.heroes { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; margin-bottom: 18px; }
.hero-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.hero-col { display: flex; flex-direction: column; gap: 10px; }
.colhead { font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); padding: 2px 2px 0; }
.revcol .hero { background: var(--accent-soft); border-color: var(--brand); }
@media (max-width: 860px) { .hero-cols { grid-template-columns: 1fr; } }
.hero {
  background: var(--card); border: 1px solid var(--ring); border-radius: 10px;
  padding: 12px 14px 10px; cursor: pointer; box-shadow: 0 1px 2px rgba(26,32,28,0.04);

.hero:hover { border-color: var(--brand); }
.hero .k { font-size: 10.5px; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.hero .v { font-size: 23px; font-weight: 660; margin: 3px 0 1px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.hero .d { font-size: 12px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 14px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
section.card {
  background: var(--card); border: 1px solid var(--ring); border-radius: 12px;
  padding: 16px 18px 12px; box-shadow: 0 1px 2px rgba(26,32,28,0.04);
}
section.card.wide { grid-column: 1 / -1; }
.cardhead { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px; }
.sec { font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
.cardhead .note { color: var(--muted); font-size: 12px; margin-left: auto; }
select.featured {
  font: 600 12.5px/1.2 system-ui, sans-serif; color: var(--ink);
  background: var(--card); border: 1px solid var(--ring); border-radius: 8px;
  padding: 6px 8px; margin-left: auto; cursor: pointer; max-width: 55%;

select.featured:focus-visible { outline: 2px solid var(--accent); }

table.rows { width: 100%; border-collapse: collapse; }
table.rows td { padding: 5px 0; border-top: 1px solid var(--grid); vertical-align: middle; }

td.lbl { color: var(--ink-2); font-size: 13.5px; padding-right: 10px; width: 34%; }
.age {

  border: 1px solid var(--grid); vertical-align: 1px; white-space: nowrap;

tr.krow { cursor: pointer; }
tr.krow:hover td.lbl, tr.krow:focus-visible td.lbl { color: var(--ink); }
tr.krow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.chev { display: inline-block; width: 13px; font-size: 10px; color: var(--muted);
        transition: transform 0.15s; }
tr.krow[aria-expanded="true"] .chev { transform: rotate(90deg); }
tr.expand td { padding: 6px 0 16px; border-top: none; }
td.spark { width: 132px; }
td.val { text-align: right; font-weight: 620; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
td.delta { text-align: right; width: 74px; white-space: nowrap; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.d-up { color: var(--up); font-weight: 600; }
.d-down { color: var(--down); font-weight: 600; }
.d-flat { color: var(--muted); }
.txtval { color: var(--ink-2); font-weight: 500; }

svg.sl { display: block; }
svg.sl polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.sl .fillarea { fill: var(--accent-soft); stroke: none; }
svg.sl .enddot { fill: var(--accent); }
svg.big, svg.bars { width: 100%; height: auto; display: block; }
svg.big .axis, svg.bars .axis { stroke: var(--grid); stroke-width: 1; }
svg.big .tick, svg.bars .tick { fill: var(--muted); font-size: 10px; }
svg.big .line { fill: none; stroke: var(--accent); stroke-width: 2;

svg.big .ghost { fill: none; stroke: var(--muted); stroke-width: 1.5;

svg.big .area { fill: var(--accent-soft); }
svg.big .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
svg.big .cdot { fill: var(--accent); opacity: 0; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin: 2px 0 8px; flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .swline { display: inline-block; width: 14px; border-top: 2px dashed var(--muted); margin-right: 5px; vertical-align: 3px; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font-size: 12px; color: var(--ink-2); border: 1px dashed var(--grid);

.chip b { color: var(--ink); font-weight: 600; }
.allclear { color: var(--muted); font-size: 13px; }

summary { font-size: 12.5px; color: var(--muted); cursor: pointer; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
table.full { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
table.full th, table.full td { padding: 3px 8px 3px 0; text-align: right; border-top: 1px solid var(--grid); white-space: nowrap; }
table.full th:first-child, table.full td:first-child { text-align: left; }
table.full thead th { border-top: none; color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }
#tip {

  background: var(--ink); color: var(--page); font-size: 12px; font-variant-numeric: tabular-nums;

footer { margin-top: 30px; color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

  const legend = ghost && ghostLine
    ? `<div class="legend"><span><span class="sw" style="background:var(--accent)"></span>current period</span>
       <span><span class="swline"></span>${ghostLabel || "prior period"}</span></div>` : "";
  return legend + `<svg class="big" viewBox="0 0 ${W} ${H}" data-key="${key}" role="img"
       aria-label="weekly trend">
    ${ticks}${xt}${ghostLine}
    <path class="area" d="${area}"/>
    <polyline class="line" points="${line}"/>
    <circle class="enddot" cx="${x(end.i).toFixed(1)}" cy="${y(end.v.v).toFixed(1)}" r="3.2"/>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}"/>
    <circle class="cdot" r="3.5"/>
  </svg>`;
}

function stackedBars(seriesArr, labels) {
  // seriesArr: [{name, color, vals}] — money bars stacked with 2px gaps.
  const n = labels.length;
  const totals = labels.map((_, i) => seriesArr.reduce((s, sr) => s + (sr.vals[i]?.v || 0), 0));
  const hi = Math.max(...totals, 1);
  const W = 680, H = 250, L = 54, R = 14, T = 14, B = 28;
  const bw = Math.min(34, (W - L - R) / n * 0.66);
  const x = i => L + ((i + 0.5) / n) * (W - L - R) - bw / 2;
  const y = v => H - B - (v / hi) * (H - T - B);
  const ticks = niceTicks(0, hi).map(v =>
    `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
     <text class="tick" x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${fmt(v, false, true)}</text>`).join("");
  const every = Math.max(1, Math.ceil(n / 8));
  const xt = labels.map((lab, i) => (i % every ? "" :
    `<text class="tick" x="${(x(i) + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${lab}</text>`)).join("");
  let rects = "";
  labels.forEach((lab, i) => {
    let acc = 0;
    seriesArr.forEach(sr => {
      const v = sr.vals[i]?.v;
      if (!v) return;
      const y1 = y(acc + v), y0 = y(acc);
      const h = Math.max(0, y0 - y1 - 2); // 2px gap between stacked segments
      if (h > 0) rects += `<rect x="${x(i).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        rx="2" fill="${sr.color}" data-w="${lab}" data-v="${sr.name}: ${fmt(v, false, true)}"/>`;
      acc += v;
    });
  });
  const legend = `<div class="legend">${seriesArr.map(sr =>
    `<span><span class="sw" style="background:${sr.color}"></span>${sr.name}</span>`).join("")}</div>`;
  return legend + `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="weekly revenue">
    ${ticks}${xt}${rects}</svg>`;
}

// ---------- renderers ----------

function heroTile(sec, label, name) {
  const key = `${sec}|${label}`;
  const s = DATA.sections.find(s => s.name === sec);
  const r = s && s.rows.find(r => r.label === label);
  const w = windowFor(key, r ? series(r) : []);
  if (!w) return "";
  return `<div class="hero" data-key="${key}" title="Open the graph">
    <div class="k">${name}</div><div class="v">${fmt(w.cur, w.pct, w.money)}</div>
    <div class="d">${pairChip(w)} <span class="d-flat">${windowSub(w)}</span></div></div>`;
}
function heroTileSum(name, parts) {
  let cur = 0, prev = 0, hasPrev = true, sub = "", key = "", got = 0;
  for (const [sec, label] of parts) {
    const sx = DATA.sections.find(s => s.name === sec);
    const r = sx && sx.rows.find(r => r.label === label);
    const w = r ? windowFor(`${sec}|${label}`, series(r)) : null;
    if (!w) continue;
    got++; cur += w.cur;
    if (w.prev == null) hasPrev = false; else prev += w.prev;
    if (!sub) { sub = windowSub(w); key = `${sec}|${label}`; }
  }
  if (!got) return "";
  const w = { cur, prev: hasPrev ? prev : null, pct: false, money: true };
  return `<div class="hero" data-key="${key}" title="Open the graph">
    <div class="k">${name}</div><div class="v">${fmt(cur, false, true)}</div>
    <div class="d">${pairChip(w)} <span class="d-flat">${sub}</span></div></div>`;
}
function heroColumns() {
  const c1 = [heroTile("INSTAGRAM", "Views", "IG Views"),
              heroTile("INSTAGRAM", "Net Follows", "IG Net Followers"),
              heroTile("FACEBOOK", "Views", "FB Views"),
              heroTile("YOUTUBE", "Views", "YouTube Views")].filter(Boolean);
  const c2 = [heroTile("PODCAST", "Total Downloads", "Podcast Downloads"),
              heroTile("EMAIL (GENERAL)", "Net Subscribers", "Newsletter Subscribers"),
              heroTile("EMAIL (GENERAL)", "Open Rate", "Email Open Rate"),
              heroTile("EMAIL (GENERAL)", "Click Rate", "Email Click Rate")].filter(Boolean);
  const c3 = [heroTile("FACEBOOK", "Revenue (est. $)", "Facebook Revenue"),
              heroTileSum("YouTube Revenue", [["YOUTUBE", "Revenue (est. $)"],
                                              ["YOUTUBE CLIPS", "Revenue (est. $)"]])].filter(Boolean);
  return `<div class="hero-cols">
    <div class="hero-col">${c1.join("")}</div>
    <div class="hero-col">${c2.join("")}</div>
    <div class="hero-col revcol"><div class="colhead">Revenue</div>${c3.join("")}</div>
  </div>`;
}

function metricRow(secName, r) {
  const vals = series(r);
  const i = lastIdx(vals);
  const key = `${secName}|${r.label}`;
  const cs = chartSeries(key, vals);
  const numericCount = vals.filter(v => v != null).length;
  const age = (i >= 0 && i < CUR) ? `<span class="age">last ${DATA.weeks[i]}</span>` : "";
  if (numericCount === 0) {
    const j = lastIdx(r.values.map(v => (String(v).trim() ? 1 : null)));
    return `<tr><td class="lbl"><span class="chev"></span>${r.label}${age}</td>
      <td class="spark"></td><td class="val"><span class="txtval">${j >= 0 ? r.values[j] : "&ndash;"}</span></td><td class="delta"></td></tr>`;
  }
  const open = EXPANDED.has(key);
  const w = windowFor(key, vals);
  let out = `<tr class="krow" data-key="${key}" tabindex="0" role="button"
      aria-expanded="${open}" title="Click for the full graph">
    <td class="lbl"><span class="chev">&#9654;</span>${r.label}${age}</td>
    <td class="spark">${sparkline(cs.cur, cs.labels)}</td>
    <td class="val" title="${windowSub(w)}">${w ? fmt(w.cur, w.pct, w.money) : (i >= 0 ? fmt(vals[i].v, vals[i].pct, vals[i].money) : "&ndash;")}</td>
    <td class="delta">${pairChip(w)}</td></tr>`;
  if (open) {
    out += `<tr class="expand"><td colspan="4">${bigChart(key, cs.cur, cs.labels, cs.ghost, cs.ghostLabel)}</td></tr>`;
  }
  return out;
}

function sectionCard(s) {
  const weeks = windowed(DATA.weeks.slice(0, CUR + 1));
  const trs = s.rows.map(r => metricRow(s.name, r)).join("");
  const head = `<tr><th>Week</th>${s.rows.map(r => `<th>${r.label}</th>`).join("")}</tr>`;
  const off = (CUR + 1) - weeks.length;
  const body = weeks.map((w, wi) =>
    `<tr><td>${w}</td>${s.rows.map(r => `<td>${r.values[off + wi] || "&ndash;"}</td>`).join("")}</tr>`).join("");
  return `<section class="card"><div class="cardhead"><h2 class="sec">${s.name}</h2></div>
    <table class="rows">${trs}</table>
    <details><summary>Table view</summary><div class="tablewrap">
    <table class="full"><thead>${head}</thead><tbody>${body}</tbody></table></div></details></section>`;
}

let FEATURED = "INSTAGRAM|Views";
function featuredOptions() {
  const opts = [];
  for (const s of DATA.sections) for (const r of s.rows) {
    if (series(r).filter(v => v != null).length > 3) opts.push(`${s.name}|${r.label}`);
  }
  return opts;
}

function renderOverview() {
  const weeks = windowed(DATA.weeks.slice(0, CUR + 1));
  const [sec, label] = FEATURED.split("|");
  const s = DATA.sections.find(x => x.name === sec);
  const r = s && s.rows.find(x => x.label === label);
  let featured = "";
  if (r) {
    const cs = chartSeries(FEATURED, series(r));
    featured = bigChart("featured::" + FEATURED, cs.cur, cs.labels, cs.ghost, cs.ghostLabel);
  }
  const options = featuredOptions().map(k =>
    `<option value="${k}" ${k === FEATURED ? "selected" : ""}>${k.replace("|", " · ")}</option>`).join("");

  const manual = [];
  let autoBehind = 0;
  for (const sx of DATA.sections) for (const rx of sx.rows) {
    const i = lastIdx(series(rx));
    if (i >= 0 && i < CUR) {
      if (AUTO.has(`${sx.name}|${rx.label}`)) autoBehind++;
      else manual.push(`<span class="chip"><b>${rx.label}</b> &middot; ${sx.name.toLowerCase()} &middot; last ${DATA.weeks[i]}</span>`);
    }
  }
  const attention = `<section class="card wide"><div class="cardhead"><h2 class="sec">Needs a human</h2>
      <span class="note">${autoBehind ? autoBehind + " automated rows update on the Monday sync" : ""}</span></div>
    ${manual.length ? `<div class="chips">${manual.join("")}</div>` : `<p class="allclear">Everything current.</p>`}</section>`;

  return heroColumns() + `<div class="grid">
    <section class="card wide"><div class="cardhead"><h2 class="sec">Featured trend</h2>
      <select class="featured" id="featuredSel" aria-label="Featured metric">${options}</select></div>
      ${featured}</section>
    ${attention}</div>`;
}

function renderRevenue() {
  const weeks = windowed(DATA.weeks.slice(0, CUR + 1));
  const colors = [getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2f9158",
                  getComputedStyle(document.documentElement).getPropertyValue("--accent-2").trim() || "#2f5d9e",
                  "#a93b27"];
  const seriesArr = [];
  for (const s of DATA.sections) {
    const r = s.rows.find(r => r.label === "Revenue (est. $)");
    if (r && series(r).some(v => v != null)) {
      const label = { "FACEBOOK": "Facebook", "YOUTUBE": "YouTube", "YOUTUBE CLIPS": "YouTube Clips" }[s.name] || s.name;
      seriesArr.push({ name: label,
                       color: colors[seriesArr.length % colors.length], vals: windowed(series(r)), full: series(r) });
    }
  }
  // Every revenue-bearing section gets a tile. Facebook has an exact daily
  // rolling window; YouTube + YouTube Clips are Studio-only, so windowFor
  // falls back to their weekly series. Combined sums whatever rendered.
  const tiles = [];
  let combCur = 0, combPrev = 0, combHasPrev = true, combSub = "";
  const revLabel = { "FACEBOOK": "Facebook", "YOUTUBE": "YouTube", "YOUTUBE CLIPS": "YouTube Clips" };
  for (const s of DATA.sections) {
    const r = s.rows.find(r => r.label === "Revenue (est. $)");
    if (!r) continue;
    const vals = series(r);
    if (!vals.some(v => v != null)) continue;
    const key = `${s.name}|Revenue (est. $)`;
    const w = windowFor(key, vals);
    if (!w) continue;
    combCur += w.cur;
    if (w.prev == null) combHasPrev = false; else combPrev += w.prev;
    if (!combSub) combSub = windowSub(w);
    tiles.push(`<div class="hero" data-key="${key}"><div class="k">${revLabel[s.name] || s.name} · ${WINDOW}d</div>
      <div class="v">${fmt(w.cur, false, true)}</div>
      <div class="d">${pairChip(w)} <span class="d-flat">${windowSub(w)}</span></div></div>`);
  }
  if (combCur && tiles.length > 1) {
    const cw = { cur: combCur, prev: combHasPrev ? combPrev : null, pct: false, money: true };
    tiles.unshift(`<div class="hero"><div class="k">Combined · ${WINDOW}d</div>
      <div class="v">${fmt(combCur, false, true)}</div>
      <div class="d">${pairChip(cw)} <span class="d-flat">${combSub}</span></div></div>`);
  }
  const chart = seriesArr.length
    ? stackedBars(seriesArr, weeks)
    : `<p class="allclear">No revenue series yet.</p>`;
  const head = `<tr><th>Week</th>${seriesArr.map(sr => `<th>${sr.name}</th>`).join("")}<th>Total</th></tr>`;
  const off = (CUR + 1) - weeks.length;
  const body = weeks.map((w, wi) => {
    const cells = seriesArr.map(sr => sr.vals[wi]?.v || 0);
    const tot = cells.reduce((a, b) => a + b, 0);
    return `<tr><td>${w}</td>${cells.map(c => `<td>${c ? fmt(c, false, true) : "&ndash;"}</td>`).join("")}<td>${tot ? fmt(tot, false, true) : "&ndash;"}</td></tr>`;
  }).join("");
  return (tiles.length ? `<div class="heroes">${tiles.join("")}</div>` : "") +
    `<div class="grid"><section class="card wide">
      <div class="cardhead"><h2 class="sec">Weekly revenue</h2>
        <span class="note">estimated, platform-reported</span></div>
      ${chart}
      <details><summary>Table view</summary><div class="tablewrap">
      <table class="full"><thead>${head}</thead><tbody>${body}</tbody></table></div></details>
    </section></div>`;
}

function render() {
  document.getElementById("gen").textContent =
    `Rolling data thru yesterday · weekly rows thru ${weekEndLabel(DATA.weeks[CUR])} (next fill Monday) · updated ${DATA.generated}`;
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button role="tab" data-tab="${t.id}" aria-selected="${t.id === TAB}">${t.label}</button>`).join("");
  const view = document.getElementById("view");
  const tab = TABS.find(t => t.id === TAB) || TABS[0];
  if (tab.id === "overview") view.innerHTML = renderOverview();
  else if (tab.id === "revenue") view.innerHTML = renderRevenue();
  else {
    const cards = (tab.sections || [])
      .map(name => DATA.sections.find(s => s.name === name))
      .filter(Boolean).map(sectionCard).join("");
    view.innerHTML = `<div class="grid">${cards || '<p class="allclear">No data yet.</p>'}</div>`;
  }
}

let TAB = (() => {
  const h = (location.hash || "").replace("#", "");
  return TABS.some(t => t.id === h) ? h : "overview";
})();

function setTab(id) {
  TAB = id;
  render();
  // Hash bookkeeping is best-effort: sandboxed hosts (the shared artifact
  // page) can refuse history writes, and that must never block the render.
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) setTab(b.dataset.tab);
});
window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "");
  if (TABS.some(t => t.id === h) && h !== TAB) { TAB = h; render(); }
});

document.querySelector(".ranges").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  WINDOW = +b.dataset.n;
  document.querySelectorAll(".ranges button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  render();
});

function toggleRow(key) {
  EXPANDED.has(key) ? EXPANDED.delete(key) : EXPANDED.add(key);
  render();
}
document.getElementById("view").addEventListener("click", e => {
  const row = e.target.closest("tr.krow");
  if (row) { toggleRow(row.dataset.key); return; }
  const h = e.target.closest(".hero[data-key]");
  if (h) {
    const [sec] = h.dataset.key.split("|");
    EXPANDED.add(h.dataset.key);
    setTab(tabOfSection(sec));
    const row = document.querySelector(`tr.krow[data-key="${CSS.escape(h.dataset.key)}"]`);
    if (row) row.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  }
});
document.getElementById("view").addEventListener("keydown", e => {
  const row = e.target.closest && e.target.closest("tr.krow");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleRow(row.dataset.key); }
});
document.getElementById("view").addEventListener("change", e => {
  if (e.target.id === "featuredSel") { FEATURED = e.target.value; render(); }
});

document.addEventListener("mousemove", e => {
  const marked = e.target.closest && e.target.closest("[data-w]");
  const big = e.target.closest && e.target.closest("svg.big");
  if (marked) {
    tip.style.display = "block";
    tip.textContent = `${marked.dataset.w}: ${marked.dataset.v}`;
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (e.clientY - 30) + "px";
    return;
  }
  if (big) {
    const d = BIGDATA[big.dataset.key];
    if (!d || !d.scale) return;
    const { lo, span, W, H, L, R, T, B } = d.scale;
    const rect = big.getBoundingClientRect();
    const vx = (e.clientX - rect.left) / rect.width * W;
    const n = d.vals.length;
    let best = -1, bd = 1e9;
    d.vals.forEach((v, i) => {
      if (v == null) return;
      const px = L + (i / (n - 1 || 1)) * (W - L - R);
      const dist = Math.abs(px - vx);
      if (dist < bd) { bd = dist; best = i; }
    });
    if (best < 0) return;
    const v = d.vals[best];
    const px = L + (best / (n - 1 || 1)) * (W - L - R);
    const py = H - B - ((v.v - lo) / span) * (H - T - B);
    const cross = big.querySelector(".cross"), cdot = big.querySelector(".cdot");
    if (cross) { cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.opacity = 1; }
    if (cdot) { cdot.setAttribute("cx", px); cdot.setAttribute("cy", py); cdot.style.opacity = 1; }
    tip.style.display = "block";
    tip.textContent = `wk of ${d.labels[best]}: ${fmt(v.v, v.pct, v.money)}`;
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (e.clientY - 30) + "px";
    return;
  }
  tip.style.display = "none";
  document.querySelectorAll("svg.big .cross, svg.big .cdot").forEach(el => el.style.opacity = 0);
});

// Hero clicks on the overview grid live inside #view; heroes rendered in
// renderRevenue()/renderOverview() are covered by the #view delegate above.
render();

</script>
